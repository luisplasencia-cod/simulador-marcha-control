; PlatformIO Project Configuration File — lectura ADS1256 por ESP32 dedicado
; Puerto de subida: NO fijado aqui (COM10 era el de la laptop de Luis, no aplica en la RPi).
; Al flashear desde la RPi: `pio run -t upload --upload-port /dev/ttyUSBx` (confirmar cual
; puerto es este ESP32 nuevo y cual es el de motores con `dmesg` o `ls /dev/ttyUSB*` ANTES
; de subir, para no flashear el ESP32 equivocado).
;
; Version de platform FIJADA (2026-11-18) en espressif32 @ 7.0.1, la misma del ESP32 de motores
; (Codigo ESP32 MOV/), por el incidente de binarios no reproducibles del 2026-11-10.
;
; Dos entornos:
;   pio run -e esp32dev   -> firmware normal (Bluetooth encendido, como el original de Luis)
;   pio run -e sin_bt     -> igual pero SIN Bluetooth (para comparar ruido: la radio del ESP32
;                            consume picos de corriente; hipotesis NO verificada)
; En ambos, el USB del ESP32 imprime un informe de arranque y un resumen por segundo
; (ver main.cpp). El paquete "<valor>" por UART2 hacia el RPi NO cambia.
[env:esp32dev]
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200

[env:sin_bt]
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DSIN_BT

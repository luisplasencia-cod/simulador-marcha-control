; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
; Version fijada 2026-11-10: es la que reproduce el firmware original (core Arduino 2.0.17,
; IDF v4.4.7). Con 6.5.0 (core 2.0.14, IDF v4.4.6) el binario NO es equivalente.
; Ver control/firmware/binarios/original_laptop/versiones_pio.txt
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino

; Elige puerto de programacion
upload_port = COM10
; Velocidad del puerto serial
monitor_speed = 115200
